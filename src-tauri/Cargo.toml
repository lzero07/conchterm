[package]
name = "conchterm"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conchterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio-util = "0.7.19"
russh-sftp = "2.4.0"
tokio = { version = "1", features = ["full"] }
dirs = "6"
base64 = "0.22"
rand = "0.9"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tauri-plugin-dialog = "2.7.2"
rusqlite = { version = "0.37", features = ["bundled"] }
# LLM 直连客户端（原 Python sidecar 的 Rust 替代）：rustls 复用 russh 已带的 ring
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "gzip"] }
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2.3.3"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "0.61"
